<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mapling spike</title>
<link rel="stylesheet" href="vendor/jsmind-0.9.1/jsmind.css">
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  #toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid #ccc; }
  #toolbar button, #toolbar select { font-size: 14px; padding: 6px 10px; }
  #status { align-self: center; font-size: 13px; color: #555; }
  #map { flex: 1; min-height: 0; }
  /* Keep line breaks of TEXT visible and let long topics wrap. */
  jmnode { white-space: pre-wrap; max-width: 320px; }
</style>
</head>
<body>
<div id="toolbar">
  <select id="fixture"><option>fixture01.mm</option></select>
  <button id="load">Load</button>
  <input type="file" id="file" accept=".mm">
  <button id="edit">Edit</button>
  <button id="add-child">Add child</button>
  <button id="add-sibling">Add sibling</button>
  <button id="delete">Delete</button>
  <button id="roundtrip">Round-trip check</button>
  <button id="download">Download</button>
  <span id="status"></span>
</div>
<div id="map"></div>
<script src="vendor/jsmind-0.9.1/jsmind.js"></script>
<script src="vendor/jsmind-0.9.1/jsmind.draggable-node.js"></script>
<script src="spike.js"></script>
</body>
</html>
